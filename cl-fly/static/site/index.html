<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星云工业 | 企业官网</title>
  <style>
    :root { --bg:#f4f7fb; --ink:#0e1a2b; --brand:#0b6ad4; --muted:#5d6b82; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:linear-gradient(135deg,#eef4ff,#ffffff 45%,#edf8f7); color:var(--ink); }
    .wrap { max-width:980px; margin:0 auto; padding:28px 18px 60px; }
    .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; }
    .logo { font-weight:700; font-size:20px; letter-spacing:.5px; }
    .nav a { color:var(--ink); text-decoration:none; margin-left:20px; }
    .hero { background:#fff; border-radius:20px; padding:38px; box-shadow:0 14px 40px rgba(10,30,70,.12); }
    h1 { margin:0 0 10px; font-size:38px; }
    p { color:var(--muted); line-height:1.7; }
    .btn { display:inline-block; margin-top:14px; padding:12px 18px; background:var(--brand); color:#fff; text-decoration:none; border-radius:12px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:20px; }
    .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    @media (max-width: 760px){ .hero{padding:24px;} h1{font-size:30px;} .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <div class="logo">星云工业 NebulaTech</div>
      <div>
        <a href="/">首页</a>
        <a href="/service">服务</a>
        <a href="/agent-demo">客服后台演示</a>
      </div>
    </div>
    <section class="hero">
      <h1>工业数字化解决方案</h1>
      <p>我们为制造业提供设备互联、生产数据可视化与远程运维方案。该示例站点已接入在线客服系统，可在服务页面右下角一键发起咨询。</p>
      <a class="btn" href="/service">进入服务页并体验在线客服</a>
      <div class="grid">
        <div class="card"><strong>设备云连接</strong><p>支持边缘设备安全接入与监控。</p></div>
        <div class="card"><strong>可视化看板</strong><p>实时展示产线关键指标与预警。</p></div>
        <div class="card"><strong>售后协同</strong><p>在线客服 + 工单协作提升响应效率。</p></div>
      </div>
    </section>
  </div>
</body>
</html>
